<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ڕیڤیوی نووسینەکانی پەپوولە</title>
<style>
:root{--bg:#fff;--ink:#1e1b4b;--mut:#64748b;--line:#e2e8f0;--ok:#059669;--okbg:#d1fae5;--ed:#d97706;--edbg:#fef3c7;--pri:#6d4ae8}
*{box-sizing:border-box;font-family:system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);padding:10px 14px}
h1{font-size:18px;margin:0 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=search]{flex:1;min-width:160px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;font-size:15px}
.chip{padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.prog{font-size:14px;color:var(--mut);margin-top:6px}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--ok);width:0}
details{border-bottom:1px solid var(--line)}
summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#f8fafc;direction:ltr;text-align:right}
summary small{color:var(--mut);font-weight:400;margin-inline-start:8px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.row.ok{background:var(--okbg)}.row.ed{background:var(--edbg)}
.txt{flex:1;font-size:17px;line-height:1.7;word-break:break-word}
.txt .ln{color:var(--mut);font-size:12px;margin-inline-end:6px}
.old{text-decoration:line-through;color:var(--mut);font-size:14px;display:block}
.btns{display:flex;gap:6px}
button.b{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
button.b.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
button.b.ed.on{background:var(--ed);border-color:var(--ed);color:#fff}
textarea{width:100%;margin-top:6px;padding:8px;border:2px solid var(--ed);border-radius:12px;font-size:17px;min-height:60px}
.foot{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:2px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.go{flex:1;min-width:140px;padding:12px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.go.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.note{padding:10px 14px;font-size:14px;color:var(--mut);line-height:1.7}
#out{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#out div{background:#fff;border-radius:20px;padding:14px;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;gap:8px}
#out textarea{flex:1;min-height:300px;border-color:var(--line);font-size:14px}
</style></head><body>

</header>

const KEY='papula_text_review_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const id=(f,l,t)=>f+'|'+l+'|'+t;
let filter='all',query='';
const list=document.getElementById('list');
function counts(){let ok=0,ed=0,tot=0;for(const f in DATA)for(const [l,t] of DATA[f]){tot++;const s=st[id(f,l,t)];if(s&&s.s==='ok')ok++;else if(s&&s.s==='ed')ed++}return{ok,ed,tot}}
function prog(){const c=counts(),done=c.ok+c.ed;document.getElementById('prog').textContent=`بینراو ${done} لە ${c.tot} • باشە ${c.ok} • گۆڕانکاری ${c.ed}`;document.getElementById('m').style.width=(100*done/c.tot)+'%'}
function vis(f,l,t){const s=st[id(f,l,t)];const k=s?s.s:'new';if(filter!=='all'&&k!==filter)return false;if(query&&!(t+(s&&s.n||'')+f).toLowerCase().includes(query))return false;return true}
function render(){
 list.innerHTML='';
 for(const f in DATA){
  const rows=DATA[f].filter(([l,t])=>vis(f,l,t));if(!rows.length)continue;
  const d=document.createElement('details');if(query||filter!=='all')d.open=true;
  const done=DATA[f].filter(([l,t])=>st[id(f,l,t)]).length;
  d.innerHTML=`<summary>${f}<small>${done}/${DATA[f].length}</small></summary>`;
  for(const [l,t] of rows){
   const k=id(f,l,t),s=st[k]||{},r=document.createElement('div');r.className='row '+(s.s||'');
   const shown=s.s==='ed'&&s.n?`<span class="old"></span>${esc(s.n)}`:esc(t);
   r.innerHTML=`<div class="txt"><span class="ln">${l}</span>${shown}</div><div class="btns"><button class="b ok ${s.s==='ok'?'on':''}" title="باشە">✓</button><button class="b ed ${s.s==='ed'?'on':''}" title="گۆڕانکاری">✎</button></div>`;
   if(s.s==='ed'&&s.n){r.querySelector('.old').textContent=t}
   r.querySelector('.ok').onclick=()=>{if(s.s==='ok')delete st[k];else st[k]={s:'ok'};save();render()};
   r.querySelector('.ed').onclick=()=>{
    if(r.querySelector('textarea')){return}
    const ta=document.createElement('textarea');ta.value=s.n||t;r.querySelector('.txt').appendChild(ta);ta.focus();
    ta.onblur=()=>{const v=ta.value.trim();if(v&&v!==t){st[k]={s:'ed',n:v}}else if(s.s==='ed'){delete st[k]}save();render()};
   };
   d.appendChild(r);
  }
  list.appendChild(d);
 }
 prog();
}
function esc(x){return x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});
document.getElementById('q').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
document.getElementById('allok').onclick=()=>{const open=[...document.querySelectorAll('details[open]')];let n=0;
 const files=open.map(d=>d.querySelector('summary').childNodes[0].textContent);
 for(const f of (files.length?files:Object.keys(DATA)))for(const [l,t] of DATA[f]){const k=id(f,l,t);if(!st[k]){st[k]={s:'ok'};n++}}
 save();render()};
document.getElementById('copy').onclick=()=>{
 const lines=[];for(const f in DATA)for(const [l,t] of DATA[f]){const s=st[id(f,l,t)];if(s&&s.s==='ed')lines.push(`فایل: ${f} (هێڵ ${l})\nپێشوو: ${t}\nنوێ: ${s.n}\n`)}
 const c=counts();
 const text=(lines.length?`ئەمانە بگۆڕە:\n\n${lines.join('\n')}`:'هیچ گۆڕانکارییەک نییە.')+`\nکورتە: ${c.ok} باشە، ${c.ed} گۆڕانکاری، ${c.tot-c.ok-c.ed} نەبینراو.`;
 document.getElementById('ta').value=text;document.getElementById('out').style.display='flex'};
document.getElementById('cl').onclick=()=>document.getElementById('out').style.display='none';
document.getElementById('cp2').onclick=()=>{const ta=document.getElementById('ta');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}};
render();
