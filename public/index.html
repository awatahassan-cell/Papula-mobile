<!DOCTYPE html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no" />
    <title>پەپوولە (Papoole) - فێربوونی منداڵانی کورد</title>

    <!-- Google Fonts: IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style id="expo-reset">
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap');

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #fffdf7;
        direction: rtl !important;
        text-align: right !important;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        direction: rtl !important;
        text-align: right !important;
      }
      /* Force IBM Plex Sans Arabic globally */
      *,
      *::before,
      *::after,
      div,
      span,
      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      button,
      input,
      textarea,
      select,
      [class*="r-fontFamily"],
      [class*="css-text"] {
        font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
    </style>
  </head>

  <body dir="rtl">
    <noscript>
      تکایە جاڤاسکریپت کارا بکە بۆ بەکارهێنانی ئەپڵیکەیشنی پەپوولە.
    </noscript>
    <div id="root" dir="rtl"></div>
  </body>
</html>
